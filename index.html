<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RmutpBlueprint</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&family=Noto+Serif+Thai:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--accent:#7A0010;--bg:#fff;--fg:#1B2430;--mut:#4A5565;--grid:#F1F3F8;--line:#8C98A8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#161B22;--fg:#E6EAF0;--mut:#A9B4C4;--grid:#232B36;--line:#6B7686;--accent:#C2394B}}
*{box-sizing:border-box}
body{margin:0;font-family:'Noto Sans Thai','Sarabun','Tahoma',system-ui,sans-serif;background:var(--bg);color:var(--fg)}
button{font-family:inherit;cursor:pointer}
button:focus-visible{outline:3px solid #E58A00;outline-offset:2px}
.wrap{max-width:1360px;margin:0 auto;padding:32px 24px 48px;display:flex;flex-direction:column;gap:24px}
.hd{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;background:var(--accent);color:#fff;padding:24px 28px;border-radius:12px;border-bottom:6px solid #F2B705}
.hd .u{font-size:16px;font-weight:600;color:#FFD966;letter-spacing:.04em}
.hd h1{margin:4px 0 0;font-size:36px;line-height:1.3;font-family:'Noto Serif Thai',Georgia,serif}
.hd .tip{font-size:15px}
.card{background:var(--bg);border-radius:16px;padding:16px;border:2px solid var(--accent)}
.map{position:relative;width:100%;aspect-ratio:16/11;background:#FFF3DA;border-radius:10px;overflow:hidden}
.map>div{position:absolute}
.bd{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:8px;padding:4px;border:3px solid #fff;box-shadow:0 2px 4px rgba(0,0,0,.3);color:#fff}
.bd[aria-pressed="true"]{border-color:#FFD54A;box-shadow:0 0 0 3px #1B2430}
.bd b{font-size:20px}.bd span{font-size:12px;line-height:1.2}
.note{margin-top:12px;font-size:13px;color:var(--mut)}
.ov{position:fixed;inset:0;z-index:50;background:rgba(20,28,40,.55);display:none;align-items:center;justify-content:center;padding:16px}
.ov.on{display:flex}
.dlg{width:100%;max-width:560px;max-height:100%;overflow-y:auto;background:var(--bg);color:var(--fg);border-radius:16px;border-top:10px solid var(--bc);padding:20px;display:flex;flex-direction:column;gap:16px}
.x{align-self:flex-end;min-height:44px;padding:0 18px;border-radius:22px;font-size:15px;font-weight:600;border:2px solid var(--line);background:var(--bg);color:var(--fg)}
.dlg .k{font-size:14px;font-weight:700;color:var(--fg)}
.dlg h2{margin:2px 0 4px;font-size:26px;line-height:1.3;font-family:'Noto Serif Thai',Georgia,serif}
.dlg .d{font-size:14px;color:var(--mut)}
.fl{display:flex;flex-wrap:wrap;gap:8px}
.fl button{min-height:44px;padding:0 18px;border-radius:22px;font-size:15px;font-weight:600;border:2px solid var(--accent);background:var(--bg);color:var(--accent)}
.fl button[aria-pressed="true"]{background:var(--accent);color:#fff}
.grid div{color:#1B2430}
.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));grid-template-rows:repeat(4,minmax(64px,1fr));gap:6px;padding:8px;background:var(--grid);border-radius:10px}
.grid div{display:flex;align-items:center;justify-content:center;text-align:center;padding:4px;font-size:13px;font-weight:600;border-radius:6px;border:1px solid}
.lg{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--mut)}
.lg i{display:inline-block;width:12px;height:12px;border:1px solid;vertical-align:-1px}
</style>
</head>
<body>
<div class="wrap">
  <div class="hd">
    <div>
      <div class="u">มหาวิทยาลัยเทคโนโลยีราชมงคลพระนคร</div>
      <h1>RmutpBlueprint</h1>
    </div>
    <div class="tip">กดที่อาคารบนแผนผังเพื่อดูแปลนแต่ละชั้น</div>
  </div>
  <div class="card">
    <div class="map" id="map">
      <div style="left:0;top:44%;width:100%;height:7%;background:#fff"></div>
      <div style="left:46%;top:0;width:6%;height:100%;background:#fff"></div>
      <div style="left:55%;top:60%;width:18%;height:34%;background:#8FD19E;border-radius:50%"></div>
      <div style="left:57%;top:75%;width:14%;font-size:12px;text-align:center;color:#14532D">สวนกลาง</div>
    </div>
    <div class="note">แผนผังนี้เป็นตัวอย่าง ปรับตำแหน่งและชื่ออาคารตามจริงได้</div>
  </div>
</div>

<div class="ov" id="ov">
  <div class="dlg" id="dlg" role="dialog" aria-modal="true" aria-label="แปลนอาคาร">
    <button class="x" id="close" aria-label="ปิดหน้าต่างแปลน">ปิด</button>
    <div>
      <div class="k" id="k"></div>
      <h2 id="nm"></h2>
      <div class="d" id="ds"></div>
    </div>
    <div class="fl" id="fl"></div>
    <div class="grid" id="grid"></div>
    <div class="lg">
      <span><i style="background:#BBDAFF;border-color:#1D6FD1"></i> ห้องเรียน</span>
      <span><i style="background:#FFD79A;border-color:#E08A00"></i> ห้องปฏิบัติการ</span>
      <span><i style="background:#B8EBC4;border-color:#1F9D55"></i> พื้นที่ส่วนกลาง</span>
      <span><i style="background:#D5D9E0;border-color:#6B7280"></i> บันได/ห้องน้ำ</span>
    </div>
  </div>
</div>

<script>
(function(){
  var T={c:['#BBDAFF','#1D6FD1'],l:['#FFD79A','#E08A00'],f:['#B8EBC4','#1F9D55'],s:['#D5D9E0','#6B7280']};
  var COL={A:'#7A0010',B:'#0B5FA5',C:'#1B7F4B',D:'#B45309',E:'#6D28D9'};
  // ห้อง: [ชื่อ, คอลัมน์, แถว, กว้าง, สูง, ประเภท] c=ห้องเรียน l=ห้องปฏิบัติการ f=ส่วนกลาง s=บันได/ห้องน้ำ
  // อาคาร: p = [ซ้าย%, บน%, กว้าง%, สูง%]
  var B=[
   {id:'A',name:'อาคารเรียนรวม',short:'เรียนรวม',desc:'ห้องบรรยายและห้องเรียนทั่วไป',p:[6,8,28,28],fl:[
    ['ชั้น 1',[['ล็อบบี้',1,1,2,2,'f'],['ห้อง 101',3,1,2,2,'c'],['ห้อง 102',5,1,2,2,'c'],['ห้องธุรการ',1,3,2,2,'f'],['ห้อง 103',3,3,4,2,'c']]],
    ['ชั้น 2',[['ห้อง 201',1,1,3,2,'c'],['ห้อง 202',4,1,3,2,'c'],['ห้อง 203',1,3,2,2,'c'],['ห้อง 204',3,3,2,2,'c'],['ห้อง 205',5,3,2,2,'c']]],
    ['ชั้น 3',[['หอประชุมย่อย',1,1,4,2,'f'],['ห้อง 301',5,1,2,2,'c'],['ห้อง 302',1,3,3,2,'c'],['ห้อง 303',4,3,3,2,'c']]]]},
   {id:'B',name:'อาคารวิศวกรรมศาสตร์',short:'วิศวะ',desc:'ห้องเรียนและห้องปฏิบัติการวิศวกรรม',p:[56,6,36,30],fl:[
    ['ชั้น 1',[['เวิร์กช็อป',1,1,3,3,'l'],['ห้อง 101',4,1,3,2,'c'],['โถงนิทรรศการ',4,3,3,2,'f']]],
    ['ชั้น 2',[['ปฏิบัติการไฟฟ้า',1,1,3,2,'l'],['ปฏิบัติการกล',4,1,3,2,'l'],['ห้อง 201',1,3,3,2,'c'],['ห้อง 202',4,3,3,2,'c']]]]},
   {id:'C',name:'หอสมุดกลาง',short:'หอสมุด',desc:'พื้นที่อ่านหนังสือและค้นคว้า',p:[6,58,28,30],fl:[
    ['ชั้น 1',[['เคาน์เตอร์บริการ',1,1,2,2,'f'],['ชั้นหนังสือ',3,1,4,2,'f'],['ห้องอ่านกลุ่ม',1,3,3,2,'c'],['มุมสืบค้น',4,3,3,2,'f']]],
    ['ชั้น 2',[['ห้องอ่านเงียบ',1,1,4,3,'f'],['ห้องประชุมกลุ่ม 1',5,1,2,2,'c'],['ห้องประชุมกลุ่ม 2',5,3,2,2,'c']]]]},
   {id:'D',name:'อาคารกิจกรรมนักศึกษา',short:'กิจกรรม',desc:'โรงอาหาร ชมรม และพื้นที่กิจกรรม',p:[78,52,18,20],fl:[
    ['ชั้น 1',[['โรงอาหาร',1,1,4,3,'f'],['ร้านค้า',5,1,2,3,'f']]],
    ['ชั้น 2',[['ห้องชมรม 1',1,1,2,2,'c'],['ห้องชมรม 2',3,1,2,2,'c'],['ห้องชมรม 3',5,1,2,2,'c'],['ห้องอเนกประสงค์',1,3,6,2,'f']]]]},
   {id:'E',name:'อาคารวิทยาศาสตร์',short:'วิทย์',desc:'ห้องปฏิบัติการวิทยาศาสตร์',p:[78,76,18,20],fl:[
    ['ชั้น 1',[['ปฏิบัติการเคมี',1,1,3,2,'l'],['ปฏิบัติการฟิสิกส์',4,1,3,2,'l'],['ห้อง 101',1,3,6,2,'c']]],
    ['ชั้น 2',[['ปฏิบัติการชีววิทยา',1,1,4,2,'l'],['ห้องเตรียมสาร',5,1,2,2,'l'],['ห้อง 201',1,3,3,2,'c'],['ห้อง 202',4,3,3,2,'c']]]]}
  ];
  var $=function(id){return document.getElementById(id)};
  var ov=$('ov'),map=$('map'),cur=null,fi=0,opener=null,btns={};

  B.forEach(function(b){
    var el=document.createElement('button');
    el.className='bd';
    el.setAttribute('aria-label','อาคาร '+b.id+' '+b.name);
    el.setAttribute('aria-pressed','false');
    el.style.cssText='left:'+b.p[0]+'%;top:'+b.p[1]+'%;width:'+b.p[2]+'%;height:'+b.p[3]+'%;background:'+COL[b.id];
    el.innerHTML='<b>'+b.id+'</b><span>'+b.short+'</span>';
    el.addEventListener('click',function(){open(b,el)});
    map.appendChild(el);btns[b.id]=el;
  });

  function render(){
    var b=cur;
    document.documentElement.style.setProperty('--bc',COL[b.id]);
    $('k').textContent='อาคาร '+b.id;
    $('nm').textContent=b.name;
    $('ds').textContent=b.desc;
    var fl=$('fl');fl.innerHTML='';
    b.fl.forEach(function(f,i){
      var x=document.createElement('button');
      x.textContent=f[0];
      x.setAttribute('aria-pressed',i===fi?'true':'false');
      x.addEventListener('click',function(){fi=i;render()});
      fl.appendChild(x);
    });
    var g=$('grid');g.innerHTML='';
    b.fl[fi][1].forEach(function(r){
      var d=document.createElement('div');
      d.textContent=r[0];
      d.style.cssText='grid-column:'+r[1]+' / span '+r[3]+';grid-row:'+r[2]+' / span '+r[4]+';background:'+T[r[5]][0]+';border-color:'+T[r[5]][1];
      g.appendChild(d);
    });
  }
  function open(b,el){
    cur=b;fi=0;opener=el;
    Object.keys(btns).forEach(function(k){btns[k].setAttribute('aria-pressed',k===b.id?'true':'false')});
    render();ov.classList.add('on');$('close').focus();
  }
  function close(){
    ov.classList.remove('on');
    Object.keys(btns).forEach(function(k){btns[k].setAttribute('aria-pressed','false')});
    if(opener)opener.focus();
  }
  $('close').addEventListener('click',close);
  ov.addEventListener('click',function(e){if(e.target===ov)close()});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&ov.classList.contains('on'))close()});
})();
</script>
</body>
</html>
